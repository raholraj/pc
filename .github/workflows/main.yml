name: Build C++ Studio APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # ── 4. Unzip project ─────────────────────────────────────────────────
      - name: Unzip cpp_studio.zip
        run: |
          unzip cpp_studio.zip
          echo "=== Files from ZIP ==="
          find cpp_studio/ -type f | sort

      # ── 5. FIX: Dart type error in settings_screen.dart ──────────────────
      #   _DropdownRow.onChanged = ValueChanged<String?> (nullable)
      #   settings.setCompiler / setCppStandard = void Function(String) (non-null)
      #   Fix: wrap with lambda so v! asserts non-null before passing
      - name: Fix Dart type errors in settings_screen.dart
        working-directory: cpp_studio
        run: |
          FILE="lib/screens/settings_screen.dart"
          sed -i \
            's/onChanged: settings\.setCompiler,/onChanged: (v) => settings.setCompiler(v!),/' \
            "$FILE"
          sed -i \
            's/onChanged: settings\.setCppStandard,/onChanged: (v) => settings.setCppStandard(v!),/' \
            "$FILE"
          echo "=== Patched lines ==="
          grep -n "setCompiler\|setCppStandard" "$FILE"

      # ── 6. Generate full Android scaffold ────────────────────────────────
      #   ZIP mein sirf AndroidManifest + 1 xml tha. Baaki sab missing:
      #   gradlew, MainActivity.kt, styles.xml, mipmap icons, build.gradle...
      - name: Generate Android scaffold via flutter create
        run: |
          flutter create \
            --org com.example \
            --project-name cpp_studio \
            --platforms android \
            /tmp/scaffold
          echo "=== Scaffold android/ tree ==="
          find /tmp/scaffold/android/ -type f | sort

      # ── 7. Copy scaffold into project (no-clobber) ───────────────────────
      #   -n = existing files overwrite nahi hoti
      #   AndroidManifest.xml aur network_security_config.xml safe rahenge
      - name: Copy scaffold android/ into project
        run: |
          cp -rn /tmp/scaffold/android/. cpp_studio/android/
          chmod +x cpp_studio/android/gradlew
          echo "=== Final android/ tree ==="
          find cpp_studio/android/ -type f | sort

      # ── 8. Write app-level build.gradle ──────────────────────────────────
      #   compileSdkVersion 35 — flutter_plugin_android_lifecycle needs 35+
      - name: Write android/app/build.gradle
        working-directory: cpp_studio
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.example.cpp_studio"
              compileSdkVersion 35
              ndkVersion flutter.ndkVersion

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId "com.example.cpp_studio"
                  minSdkVersion 21
                  targetSdkVersion 35
                  versionCode flutter.versionCode
                  versionName flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle

      # ── 9. Write project-level build.gradle ──────────────────────────────
      #   Flutter 3.16+ new plugin format — NO buildscript/classpath block
      - name: Write android/build.gradle
        working-directory: cpp_studio
        run: |
          cat > android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          echo "=== android/build.gradle ==="
          cat android/build.gradle

      # ── 10. Write settings.gradle ─────────────────────────────────────────
      #   include ':app' — without this Gradle can't find assembleRelease task
      - name: Write android/settings.gradle
        working-directory: cpp_studio
        run: |
          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application"           version "8.1.0" apply false
              id "org.jetbrains.kotlin.android"      version "1.9.10" apply false
          }

          include ":app"
          EOF
          echo "=== settings.gradle ==="
          cat android/settings.gradle

      # ── 11. Write gradle.properties ──────────────────────────────────────
      - name: Write android/gradle.properties
        working-directory: cpp_studio
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          echo "=== gradle.properties ==="
          cat android/gradle.properties

      # ── 12. Write gradle-wrapper.properties ──────────────────────────────
      - name: Write gradle-wrapper.properties
        working-directory: cpp_studio
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
          EOF
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      # ── 13. Flutter pub get ───────────────────────────────────────────────
      - name: Flutter pub get
        working-directory: cpp_studio
        run: flutter pub get

      # ── 14. Debug tree ────────────────────────────────────────────────────
      - name: Show final android/ structure
        working-directory: cpp_studio
        run: find android/ -type f | sort

      # ── 15. Analyze (non-fatal) ───────────────────────────────────────────
      - name: Flutter analyze
        working-directory: cpp_studio
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # ── 16. Build split APKs ──────────────────────────────────────────────
      - name: Build split APKs
        working-directory: cpp_studio
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi

      # ── 17. Build universal APK ───────────────────────────────────────────
      - name: Build universal APK
        working-directory: cpp_studio
        run: flutter build apk --release --no-shrink

      # ── 18. List APKs ─────────────────────────────────────────────────────
      - name: List built APKs
        run: |
          echo "=== APK files ==="
          find cpp_studio/build/app/outputs/flutter-apk/ -name "*.apk" | sort
          echo "=== Sizes ==="
          find cpp_studio/build/app/outputs/flutter-apk/ -name "*.apk" \
            -exec du -sh {} \;

      # ── 19. Upload split APKs ─────────────────────────────────────────────
      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: cpp-studio-split-apks
          path: cpp_studio/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30

      # ── 20. Upload universal APK ──────────────────────────────────────────
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: cpp-studio-universal-apk
          path: cpp_studio/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
